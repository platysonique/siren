# Both USB HIFI AUDIO units share vendor/product/serial, so ACP collapses them
# into one PipeWire device. Disable ACP so each ALSA card stays separate.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-HIFI_AUDIO_USB_HIFI_AUDIO_5000000001.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
]
