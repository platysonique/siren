# 8-channel PipeWire source for OBS / other apps (optional).
# Restart: systemctl --user restart pipewire pipewire-pulse wireplumber

context.modules = [
    { name = libpipewire-module-combine-stream
        args = {
            combine.mode = source
            node.name = "combine_source_bloodsiren"
            node.description = "bloodsiren"
            combine.latency-compensate = true
            combine.props = {
                audio.position = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 ]
            }
            stream.props = {
                stream.dont-remix = true
            }
            stream.rules = [
                { matches = [
                    { media.class = "Audio/Source"
                      object.path = "alsa:pcm:AUDIO:0:capture"
                    }
                  ]
                  actions = { create-stream = {
                      audio.position = [ FL FR RL RR ]
                      combine.audio.position = [ AUX0 AUX1 AUX2 AUX3 ]
                  } }
                }
                { matches = [
                    { media.class = "Audio/Source"
                      object.path = "alsa:pcm:AUDIO_1:0:capture"
                    }
                  ]
                  actions = { create-stream = {
                      audio.position = [ FL FR RL RR ]
                      combine.audio.position = [ AUX4 AUX5 AUX6 AUX7 ]
                  } }
                }
            ]
        }
    }
]
